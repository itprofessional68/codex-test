name: Agent PR validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check repository scripts
        shell: bash
        run: |
          test -f package.json || { echo 'Adapt CI: package.json missing'; exit 1; }
          test -f package-lock.json || { echo 'Adapt CI: package-lock.json missing'; exit 1; }
          node -e "const p=require('./package.json'); for(const x of ['lint','test','build']) if(!p.scripts?.[x]) { console.error('Missing script: '+x); process.exitCode=1 }"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
